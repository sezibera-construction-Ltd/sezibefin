<svg xmlns="http://www.w3.org/2000/svg" width="606" height="606" viewBox="0 0 606 606">
  <!-- No background: the mark sits on whatever the tab strip provides. width
       and height are declared as well as the viewBox — an SVG with no
       intrinsic size can fail to rasterise as a favicon, and Chrome prefers
       the SVG icon when one is declared. The fill flips with the OS theme so
       the mark stays visible on a light or a dark tab strip. -->
  <style>
    .mark { fill: #17181a; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f7f6f3; } }
  </style>
  <g class="mark" transform="translate(40,116)">
    <rect x="0" y="72" width="34" height="238" rx="17"/>
    <rect x="98" y="15" width="34" height="343" rx="17"/>
    <rect x="196" y="59" width="34" height="257" rx="17"/>
    <rect x="294" y="99" width="34" height="179" rx="17"/>
    <rect x="392" y="1" width="34" height="372" rx="17"/>
    <rect x="492" y="49" width="34" height="276" rx="17"/>
  </g>
</svg>
